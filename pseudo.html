<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Mood Journal</title>
  <link rel="stylesheet" href="pseudo.css">
</head>
<body>

  <h1>🌟 My Mood Journal</h1>

  <div class="entry happy">
    <h2>Feeling Great!</h2>
    <p>Today was awesome. I finished my homework and played outside!</p>
    <button class="like-button">❤️ Like</button>
  </div>

  <div class="entry meh">
    <h2>Just Okay</h2>
    <p>Nothing exciting today. Just a regular, average kind of day.</p>
    <button class="like-button">❤️ Like</button>
  </div>

  <div class="entry sad">
    <h2>Not the Best Day</h2>
    <p>I felt a bit down today. Hopefully tomorrow will be better.</p>
    <button class="like-button">❤️ Like</button>
  </div>

</body>
</html>
